name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack install

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Markdown lint
        run: pnpm lint:md

      - name: ESLint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

  test-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack install

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @zai/portal test:coverage
