name: Deploy Portal

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack install

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
        run: pnpm build

      - name: Package Pages artifact
        run: |
          mkdir -p /tmp/github-pages
          tar --directory apps/portal/dist -cf /tmp/github-pages/artifact.tar .
          gzip -9 /tmp/github-pages/artifact.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: /tmp/github-pages/artifact.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
